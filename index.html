<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration Form</title>
</head>
<body bgcolor="navyblue">

    <table border="0" width="600" align="center" cellpadding="10" cellspacing="0">
        <tr>
            <td align="center">
                <!-- Form Title Box -->
                <table border="1" width="100%" cellpadding="15" cellspacing="0" bgcolor="lightgrey">
                    <tr>
                        <td align="center">
                            <h1>STUDENT REGESTRATION FORM</h1>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
            <td>
                <!-- Form Fields -->
                <form action="#" method="POST">
                    <table border="0" width="200%" cellpadding="15" cellspacing="0">
                        <!-- Name -->
                        <tr>
                            <td width="25%"><b>Name :</b></td>
                            <td><input type="text" name="name" placeholder="Enter full name" size="40"></td>
                        </tr>
                        <!-- Father's Name -->
                        <tr>
                            <td><b>Fathr Name :</b></td>
                            <td><input type="text" name="father_name" size="60"></td>
                        </tr>
                        <!-- Mother's Name -->
                        <tr>
                            <td><b>Mother's Name :</b></td>
                            <td><input type="text" name="mother_name" size="40"></td>
                        </tr>
                        <!-- Phone Number -->
                        <tr>
                            <td><b>Phone Number :</b></td>
                            <td><input type="text" name="phone" placeholder="017xxxxxxxx" size="40"></td>
                        </tr>
                        <!-- Email -->
                        <tr>
                            <td><b>Email :</b></td>
                            <td><input type="email" name="email" placeholder="sample@example.com" size="40"></td>
                        </tr>
                        <!-- Gender -->
                        <tr>
                            <td><b>Gender :</b></td>
                            <td>
                                <input type="radio" name="gender" value="Male"> Male
                                <input type="radio" name="gender" value="Female"> Female
                                <input type="radio" name="gender" value="Other"> Other
                            </td>
                        </tr>
                        <!-- Date Of Birth -->
                        <tr>
                            <td><b>Date Of Birth :</b></td>
                            <td>
                                <input type="text" name="dob_day" size="2"> - 
                                <input type="text" name="dob_month" size="2"> - 
                                <input type="text" name="dob_year" size="4"> 
                                <font size="2" color="gray"><i>(dd-mm-yyyy)</i></font>
                            </td>
                        </tr>
                        <!-- Address -->
                        <tr>
                            <td><b>Address :</b></td>
                            <td><input type="text" name="address" placeholder="Street:- House:- Road:-" size="60"></td>
                        </tr>
                        <!-- Blood Group -->
                        <tr>
                            <td><b>Blood Group :</b></td>
                            <td>
                                <select name="blood_group">
                                    <option value="">Select</option>
                                    <option value="A+">A+</option>
                                    <option value="A-">A-</option>
                                    <option value="B+">B+</option>
                                    <option value="B-">B-</option>
                                    <option value="O+">O+</option>
                                    <option value="O-">O-</option>
                                    <option value="AB+">AB+</option>
                                    <option value="AB-">AB-</option>
                                </select>
                            </td>
                        </tr>
                        <!-- Department -->
                        <tr>
                            <td><b>Departmentt :</b></td>
                            <td>
                                <input type="radio" name="department" value="CSE"> CSE
                                <input type="radio" name="department" value="EEE"> EE
                                <input type="radio" name="department" value="BBA"> BBA
                            </td>
                        </tr>
                        <!-- Course -->
                        <tr>
                            <td><b>cours :</b></td>
                            <td>
                                <input type="checkbox" name="course" value="C"> C
                                <input type="checkbox" name="course" value="C++"> C++
                                <input type="checkbox" name="course" value="Java"> Java
                                <input type="checkbox" name="course" value="AI"> AI
                                <input type="checkbox" name="course" value="Machine learning"> Machine learning
                                <input type="checkbox" name="course" value="Robotics"> Robotics
                            </td>
                        </tr>
                        <!-- Photo -->
                        <tr>
                            <td><b>Photo :</b></td>
                            <td>
                                <input type="file" name="photo">
                            </td>
                        </tr>
                        <!-- Actions -->
                        <tr>
                            <td></td>
                            <td>
                                <br>
                                <input type="submit" value="Submit">
                                <input type="reset" value="Reset">
                            </td>
                        </tr>
                    </table>
                </form>
            </td>
        </tr>
    </table>

</body>
</html>
